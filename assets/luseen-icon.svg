<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3b2f8f"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="0.7" stop-color="#d7263d"/>
      <stop offset="1" stop-color="#7a0f2a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#ff4d4d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="512" cy="428" r="15" fill="#fff"/>
      <circle cx="519" cy="423" r="13" fill="#000"/>
    </mask>
    <clipPath id="half"><rect x="497" y="581" width="15" height="30"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="140" fill="url(#glow)"/>
  <path d="M152 512 C 290 300, 734 300, 872 512 C 734 724, 290 724, 152 512 Z"
        fill="none" stroke="#e9e5ff" stroke-width="44" stroke-linejoin="round"/>
  <circle cx="512" cy="512" r="118" fill="url(#iris)"/>
  <circle cx="512" cy="512" r="84" fill="none" stroke="#2a0a14" stroke-width="5" opacity="0.55"/>
  <!-- four moon phases on the ring: new (left), crescent (top), full (right), half (bottom) -->
  <circle cx="428" cy="512" r="14" fill="#2a0a14" stroke="#ffd59e" stroke-width="3"/>
  <circle cx="512" cy="428" r="15" fill="#2a0a14"/>
  <rect width="1024" height="1024" fill="#ffd59e" mask="url(#crescent)"/>
  <circle cx="596" cy="512" r="15" fill="#ffd59e"/>
  <circle cx="512" cy="596" r="15" fill="#2a0a14"/>
  <circle cx="512" cy="596" r="15" fill="#ffd59e" clip-path="url(#half)"/>
  <circle cx="512" cy="512" r="34" fill="#14060c"/>
  <circle cx="500" cy="500" r="9" fill="#ffffff" opacity="0.7"/>
</svg>
